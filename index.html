<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>My first three.js app</title>
    <script type="module" src="/main.js"></script>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
        }

        #canva {
            width: 100%;
            height: 100%;
            display: block;
        }

        #scoreInformation {
            position: absolute;
            left: 1em;
            top: 1em;
            padding: 1em;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <canvas id="canva"></canvas>
    <div id="scoreInformation">
        <div>Score: <span id="score"></span></div>
    </div>
</body>

</html>
